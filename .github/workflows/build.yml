name: 🏭 Build

on:
  push:
    branches:
    - main
    - 'v*.*'
    - validate/*
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BUILDCONFIGURATION: Release
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages/

jobs:
  build:
    name: 🏭 Build

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-26.04
          rid: linux-x64
        - os: macOS-15
          rid: osx-arm64
        - os: windows-2025
          rid: win-x64

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
    - name: ⚙ Install prerequisites
      run: |
        ./init.ps1 -UpgradePrerequisites -NoNuGetCredProvider
        dotnet --info

        # Print mono version if it is present.
        if (Get-Command mono -ErrorAction SilentlyContinue) {
          mono --version
        }
      shell: pwsh
    - name: ⚙️ Set pipeline variables based on source
      run: tools/variables/_define.ps1
      shell: pwsh
    - name: 🛠 build
      run: dotnet build tools/dirs.proj -t:build,pack,publish --no-restore -c ${{ env.BUILDCONFIGURATION }} -warnAsError -warnNotAsError:NU1901,NU1902,NU1903,NU1904 /bl:"${{ runner.temp }}/_artifacts/build_logs/build.binlog"
    - name: 🧪 Run NativeAOT runtime compatibility test
      run: |
        $extension = if ($IsWindows) { '.exe' } else { '' }
        & "./bin/AotRuntimeCompatibilityTest/${{ env.BUILDCONFIGURATION }}/net10.0/${{ matrix.rid }}/publish/AotRuntimeCompatibilityTest$extension"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      shell: pwsh
    - name: 🧪 test
      run: tools/dotnet-test-cloud.ps1 -Configuration ${{ env.BUILDCONFIGURATION }} -Agent ${{ runner.os }} -IncludeNativeAOT
      shell: pwsh
    - name: 🏭 Measure and run minimal NativeAOT image
      run: |
        $extension = if ($IsWindows) { '.exe' } else { '' }
        ./tools/Measure-AotImage.ps1 `
          -Path "./bin/AotSizeTest/${{ env.BUILDCONFIGURATION }}/net10.0/${{ matrix.rid }}/publish/AotSizeTest$extension" `
          -RuntimeIdentifier '${{ matrix.rid }}' `
          -OutputPath 'aot-size-result.json'
      shell: pwsh
    - name: 📤 Upload AOT size result
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: aot-size-${{ matrix.os }}-${{ matrix.rid }}
        path: aot-size-result.json
        if-no-files-found: error
    - name: 📤 Upload native image and compiler size reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: aot-image-${{ matrix.os }}-${{ matrix.rid }}
        path: |
          bin/AotSizeTest/${{ env.BUILDCONFIGURATION }}/net10.0/${{ matrix.rid }}/publish/
          obj/test/AotSizeTest/${{ env.BUILDCONFIGURATION }}/net10.0/${{ matrix.rid }}/native/
        if-no-files-found: error
    - name: 💅🏻 Verify formatted code
      run: dotnet format --verify-no-changes --no-restore
      shell: pwsh
      if: runner.os == 'Linux'
    - name: 📚 Verify docfx build
      run: dotnet docfx docfx/docfx.json --warningsAsErrors --disableGitFeatures
      if: runner.os == 'Linux'
    - name: ⚙ Update pipeline variables based on build outputs
      run: tools/variables/_define.ps1
      shell: pwsh
    - name: 📢 Publish artifacts
      uses: ./.github/actions/publish-artifacts
      if: cancelled() == false
    - name: 📢 Publish code coverage results to codecov.io
      run: |
        if ('${{ secrets.CODECOV_TOKEN }}') {
          ./tools/publish-CodeCov.ps1 -CodeCovToken '${{ secrets.CODECOV_TOKEN }}' -PathToCodeCoverage "${{ runner.temp }}/_artifacts/coverageResults" -Name "${{ runner.os }} Coverage Results" -Flags "${{ runner.os }}"
        }
      shell: pwsh
      timeout-minutes: 3

  verify-aot-size:
    name: 👮🏼 NativeAOT image size report
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: 📥 Download AOT size results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: aot-size-*
        path: aot-results
    - name: 🧪 Check AOT sizes
      run: |
        $FailedChecks = @()
        $Combinations = @(
          @{ OS = 'ubuntu-26.04'; RID = 'linux-x64' },
          @{ OS = 'macOS-15'; RID = 'osx-arm64' },
          @{ OS = 'windows-2025'; RID = 'win-x64' }
        )

        "Target | Native image bytes | Native image MiB | Round-trip
        --|--|--|--" >> $env:GITHUB_STEP_SUMMARY

        foreach ($Combo in $Combinations) {
          $ArtifactName = "aot-size-$($Combo.OS)-$($Combo.RID)"
          $ResultFile = "aot-results/$ArtifactName/aot-size-result.json"

          if (Test-Path $ResultFile) {
            $Details = Get-Content $ResultFile | ConvertFrom-Json
            $Valid = $Details.Result -eq 'PASS' -and $Details.SizeBytes -gt 0 -and $Details.RuntimeIdentifier -eq $Combo.RID
            $Emoji = if ($Valid) { '✅' } else { '❌' }
            " $($Combo.RID) | {0} | {1:0.00} | $Emoji" -f $Details.SizeBytes, ($Details.SizeBytes / 1MB) >> $env:GITHUB_STEP_SUMMARY
            if (!$Valid) {
              $FailedChecks += "$($Combo.OS) ($($Combo.RID))"
            }
          } else {
            $FailedChecks += "$($Combo.OS) ($($Combo.RID)) missing result"
          }
        }

        if ($FailedChecks.Count -gt 0) {
          Write-Error "NativeAOT image size check failed for: $($FailedChecks -join ', ')"
          exit 1
        }
      shell: pwsh

  docs:
    name: 📃 Docs
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: 🔗 Markup Link Checker (mlc)
      uses: becheran/mlc@b0d0d353e04fcbcfd1d86716103d78a61e5b25dd # v1.2.2
